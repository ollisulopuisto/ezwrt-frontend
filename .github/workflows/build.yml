name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Vite 7 requires ^20.19.0 || >=22.12.0
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Test the OpenWrt installer's download verification
      run: sh scripts/test-openwrt-install.sh
      
    - name: Build production app
      run: npm run build
      
    - name: Upload production artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
